<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Diagnóstico — IDEAL OLÍMPICO</title>
<style>body{font:18px system-ui;margin:24px auto;padding:0 20px;max-width:700px;color:#33252a}h1{color:#821a2b;font-size:28px}button{font:inherit;background:#821a2b;color:white;border:0;border-radius:8px;padding:14px;margin:8px 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f3f3;padding:16px;border-radius:8px;font-size:14px}p{line-height:1.5}</style></head>
<body><h1>Teste de conexão do portal</h1><p>Esta página verifica a conexão com o ambiente de teste. Não solicita dados de aluno e não cria inscrições nem pedidos.</p><p id="status" role="status" aria-live="polite">Preparando diagnóstico…</p><button id="probe" disabled>Testar resposta do servidor</button><p>Se a conexão parar, envie uma captura deste relatório à equipe.</p><pre id="report"></pre>
<script>
(()=>{'use strict';
  const started=Date.now(),report=document.getElementById('report'),status=document.getElementById('status'),button=document.getElementById('probe');
  let connected=false,finished=false;
  const seen=new Set();
  const log=text=>{report.textContent+=((Date.now()-started)/1000).toFixed(1)+'s — '+text+'\n';};
  log('Diagnóstico v20261021-1. Sem dados pessoais.');
  log('URLSearchParams.size: '+(new URL('https://example.com/?a=1').searchParams.size===1?'disponível':'indisponível'));
  log('Proxy: '+(typeof Proxy==='function'?'disponível':'indisponível'));
  window.addEventListener('error',event=>{log(event.target&&event.target.tagName==='SCRIPT'?'ERRO: arquivo JavaScript não carregou.':'ERRO: execução de JavaScript interrompida.');status.textContent='Falha ao iniciar a página. Envie o relatório.';},true);
  function originAllowed(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||/^[a-z0-9-]+-script\.googleusercontent\.com$/.test(u.hostname));}catch{return false;}}
  function belongs(candidate){const f=document.querySelector('iframe[title="Conexão segura com o portal"]');if(!f)return false;const stack=[{w:f.contentWindow,d:0}],visited=new Set();while(stack.length&&visited.size<32){const {w,d}=stack.pop();if(w===candidate)return true;if(!w||visited.has(w)||d>=8)continue;visited.add(w);try{for(let i=0;i<w.frames.length&&i<20;i++)stack.push({w:w.frames[i],d:d+1});}catch{}}return false;}
  window.addEventListener('message',event=>{
    const type=event.data&&event.data.type;
    if(!['ideal-student-ready','ideal-student-connected','ideal-student-result'].includes(type))return;
    const trusted=originAllowed(event.origin),related=belongs(event.source),key=type+trusted+related;
    if(!seen.has(key)){seen.add(key);log(type+' | origem Google: '+trusted+' | iframe esperado: '+related);}
    if(type==='ideal-student-connected'&&trusted&&related){connected=true;button.disabled=false;status.textContent='Conexão estabelecida. Toque no botão para testar a resposta do servidor.';}
  });
  const wait=setTimeout(()=>{if(!connected){status.textContent='A conexão com o Google não foi estabelecida em 25 segundos.';log('TIMEOUT_CONEXAO');}},25000);
  button.addEventListener('click',()=>{
    if(!connected||finished)return;button.disabled=true;finished=true;clearTimeout(wait);status.textContent='Verificando resposta do servidor…';log('Enviando matrícula vazia: validação rejeita antes de consultar ou gravar a planilha.');
    try{window.google.script.run.withSuccessHandler(()=>{status.textContent='Resposta recebida, mas diferente da rejeição esperada. Envie o relatório.';log('RESPOSTA_INESPERADA');}).withFailureHandler(error=>{
      const expected=String(error&&error.message||'').includes('matrícula deve conter exatamente 5');
      status.textContent=expected?'O servidor respondeu corretamente. A comunicação de ida e volta funcionou neste navegador.':'O teste recebeu uma falha. Envie o relatório à equipe.';
      log(expected?'SUCESSO: rejeição esperada recebida do servidor.':'FALHA: resposta diferente da validação esperada.');
    }).autenticarAluno('','');}catch{log('ERRO_LOCAL: chamada não iniciou.');status.textContent='A chamada não iniciou. Envie o relatório.';}
  });
  window.addEventListener('load',()=>{log('Página terminou de carregar.');const frame=document.querySelector('iframe[title="Conexão segura com o portal"]');log('Iframe criado: '+!!frame);if(frame)log('Backend: '+(frame.src===window.PORTAL_TEST_CONFIG.bridgeUrl?'homologação configurada':'configuração divergente'));});
  status.textContent='Aguardando conexão com o Google…';
})();
</script><script src="config.js?v=isolated-bridge-v27"></script><script src="api.js?v=diagnostico-20261021-1"></script></body></html>
