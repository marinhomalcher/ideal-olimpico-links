<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse o Portal de Inscrições IDEAL OLÍMPICO: área do aluno ou área do coordenador.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IDEAL OLÍMPICO">
  <meta property="og:title" content="Portal de Inscrições — IDEAL OLÍMPICO">
  <meta property="og:description" content="Acesse a área do aluno ou a área do coordenador do Portal IDEAL OLÍMPICO.">
  <meta property="og:url" content="https://idealolimpico.com.br/">
  <meta property="og:image" content="https://idealolimpico.com.br/logo-ideal-olimpico.png">
  <meta property="og:image:secure_url" content="https://idealolimpico.com.br/logo-ideal-olimpico.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="2170">
  <meta property="og:image:height" content="2148">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Portal de Inscrições — IDEAL OLÍMPICO">
  <meta name="twitter:description" content="Acesse a área do aluno ou a área do coordenador do Portal IDEAL OLÍMPICO.">
  <meta name="twitter:image" content="https://idealolimpico.com.br/logo-ideal-olimpico.png">
  <title>Portal de Inscrições — IDEAL OLÍMPICO</title>
  <style>
    :root { color-scheme: light; --wine: #781526; --wine-dark: #5d0f1e; --gold: #d4ad58; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 20px; background: linear-gradient(145deg, #fffaf0, #f7f1eb); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 760px); padding: clamp(32px, 7vw, 64px); border: 1px solid #eadfd5; border-radius: 26px; background: #fff; box-shadow: 0 18px 55px #4d1a1712; text-align: center; }
    .logo { display: block; width: clamp(130px, 30vw, 210px); height: auto; margin: 0 auto 34px; }
    h1 { margin: 0 0 30px; color: var(--wine); font-size: clamp(1.5rem, 4vw, 2rem); }
    nav { display: flex; justify-content: center; gap: 16px; }
    .button { display: inline-flex; flex: 1; min-height: 64px; align-items: center; justify-content: center; padding: 16px 22px; border: 2px solid var(--wine); border-radius: 12px; color: #fff; background: var(--wine); font-size: 1.05rem; font-weight: 800; text-decoration: none; transition: background .15s ease, transform .15s ease; }
    .button:hover { background: var(--wine-dark); transform: translateY(-1px); }
    .button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    @media (max-width: 560px) { main { padding: 36px 22px; } nav { flex-direction: column; gap: 12px; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo-ideal-olimpico.png" alt="IDEAL OLÍMPICO">
    <h1>Portal de Inscrições</h1>
    <nav aria-label="Escolha sua área">
      <a class="button" href="/inscricoes/">ÁREA DO ALUNO</a>
      <a class="button" href="/inscricoes/coordenador/">ÁREA DO COORDENADOR</a>
    </nav>
  </main>
</body>
</html>
