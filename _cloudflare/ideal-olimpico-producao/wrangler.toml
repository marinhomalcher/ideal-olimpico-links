# Worker de produção do Portal IDEAL OLÍMPICO (área do aluno).
# Os valores secretos NÃO ficam aqui: estão só no painel do Cloudflare
# (Workers > ideal-olimpico-producao > Configurações > Variáveis e segredos).
#   APPS_SCRIPT_PROD_EXEC_URL  (texto)   URL /exec do Apps Script de produção
#   PORTAL_PROD_PROXY_SECRET   (segredo) senha compartilhada com o Apps Script
#   PORTAL_RATE_KEY_SECRET     (segredo) chave usada para anonimizar os limites
name = "ideal-olimpico-producao"
main = "worker.js"
compatibility_date = "2026-11-05"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[ratelimits]]
name = "PORTAL_LOGIN_LIMITER"
namespace_id = "2026110501"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "PORTAL_LOGIN_IP_LIMITER"
namespace_id = "2026110502"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "PORTAL_SESSION_LIMITER"
namespace_id = "2026110503"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "PORTAL_CATALOG_LIMITER"
namespace_id = "2026110504"
simple = { limit = 5000, period = 60 }

[[ratelimits]]
name = "PORTAL_UPLOAD_LIMITER"
namespace_id = "2026110505"
simple = { limit = 3, period = 60 }
